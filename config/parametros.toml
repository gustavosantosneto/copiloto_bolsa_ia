# Parâmetros do copiloto_bolsa_ia
# Status por linha: [obs]=observado [pref]=preferência [hip]=hipótese [PENDENTE]=confirmar
# Credenciais NUNCA aqui → .env

[geral]
ambiente = "demo"                  # demo | real. Real só por escolha explícita
somente_leitura = true             # V1: sistema não envia ordens
fuso = "America/Sao_Paulo"
moeda = "BRL"

[mt5]
caminho_terminal = ""              # vazio = terminal padrão. Login/senha/servidor → .env
timeout_conexao_ms = 10000
tentativas_reconexao = 5
intervalo_reconexao_s = 5

[coletor]
intervalo_poll_s = 1.0             # SDK sem listener → polling
intervalo_poll_fora_pregao_s = 30
intervalo_candles_s = 60
historico_deals_dias = 30          # janela inicial de importação

[pregao]
abertura = "10:00"
fechamento = "17:00"
janela_operacao_inicio = "10:00"   # [pref]
janela_operacao_fim = "15:00"      # [pref]

[universo]
watchlist = [                      # [obs] 2026-09-24
  "ABEV3", "B3SA3", "BBAS3", "BBDC3", "BBSE3", "CXSE3", "ENEV3", "EQTL3", "ITSA4",
  "ITUB4", "RADL3", "RDOR3", "RENT3", "SANB11", "SBSP3", "TIMS3", "VIVT3",
]
preco_max_acao = 50.0              # [pref] ~R$50

[timeframes]
principal = "M12"                  # [obs]
auxiliar = "M6"                    # [pref]
disponiveis = ["M2", "M6", "M12", "H1", "D1"]

[operacao]
lote_padrao = 100                  # múltiplos de 100
corretagem = 0.0                   # [obs]
emolumentos_day_trade_pct = 0.023  # [obs] 2026-10-20 site B3, por lado, ADTV DT ≤R$0,2 mi, inclui tributos
emolumentos_swing_pct = 0.030      # [obs] 2026-10-20 site B3, por lado, ADTV ≤R$3 mi
max_operacoes_dia = 10              # [hip] referência, não trava
ref_pct_nova_entrada = 0.25        # [hip] alternativas 0.15 / 0.40
max_entradas_preco_medio = 10       # [PENDENTE]

[risco]                            # [pref] usuário 2026-10-19
perda_max_dia = 20                 # % do saldo no início do dia
perda_max_operacao = 200           # R$
perda_aberta_max_ativo_pct = 10.0  # % do saldo; P&L aberto do ativo não pode passar de −isso (5k → −R$500)
perda_aberta_max_total_pct = 20.0  # % do saldo; soma do P&L aberto de todas as posições
margem_usada_max_pct = 20.0        # % do patrimônio; base = margem usada (limite separado)
nivel_margem_min_pct = 2000      # atenção abaixo disso
max_posicoes_abertas = 10
max_lotes_ativo = 15               # [pref] 2026-10-19 lotes padrão por ativo (inclui os já em carteira)
atencao_correlacao_posicoes = 0.8   # [pref] 2026-10-20 correlação média (bruta, ajustada pela direção) de cada posição com as outras
atencao_concentracao_exposicao_pct = 80.0  # [pref] 2026-10-20 % do valor aberto em posições acima dessa média → atenção
hedge_min_pct = 20.0               # [pref] 2026-10-20 valor no lado oposto (seguro) ≥ X% do valor aberto; abaixo → atenção
min_posicoes_carteira = 3          # [pref] 2026-10-20 concentração e hedge só com ≥ N ativos em posição

[simulacao]                        # só ambiente=demo; em real ignorado (usa conta + MT5)
capital_simulado = 5000.0          # [pref] 2026-10-19 R$; demo tem ~R$1mi irreal. 0 = usar conta
alavancagem_simulada = 200.0       # [hip] 2026-10-19 até medir na real. 0 = margem prevista MT5

[registro]
snapshot_antes_depois = true       # regra de gestão: todo deal
comparar_margem_prevista = true    # vs order_calc_margin
tolerancia_divergencia_margem_pct = 10.0
csv_historico = "dados/{conta}_historico_trades.csv"         # 1 arquivo por conta MT5
csv_base_operacional = "dados/{conta}_base_operacional.csv"  # gerado do histórico
csv_corretoras = "dados/corretoras.csv"
csv_margens_corretora = "dados/margens_corretora.csv"        # ativo × corretora
min_medicoes_margem_validada = 3   # medições p/ considerar margem confiável

[persistencia]
banco = "data/copiloto.sqlite"     # data/ fora do git

[similaridade]                     # V2
janela_sessoes = 63                # [pref] 2026-10-20 base de uso = ~90 dias (concentração, `copiloto similaridade`)
janela_minutos = 60                # [pref] 2026-10-20 matriz do painel = últimos N minutos, ao vivo
metodo_padrao = "pearson"          # pearson | xcorr | dtw | coint | granger
base = "retorno_log"
limiar_direta = 0.7
limiar_inversa = -0.5
lag_max_candles = 10
desvio_max_candles = 12           # [pref] 2026-10-20 ângulo: compara A_t com B_t±k, k ≤ N (M1 → 12 min), só dentro do dia
timeframe = "M12"                  # [pref] 2026-10-20 correlação (gráfico principal)
timeframe_atraso = "M1"            # [pref] 2026-10-20 atraso líder→seguidor (lag_max_candles em M1 = até 10 min)
fdr_max = 0.05                     # [hip] q-valor máx. (Benjamini-Hochberg) p/ atraso/Granger/cointegração "significativo"
arquivo = "data/mercado/similaridade.json"  # resultado do `copiloto similaridade` (90 dias; concentração lê daqui)

[indicadores]                      # V3
ema_periodo = 24                   # [obs] method=1
rsi_periodo = 10                   # [obs]
vwap = ["diaria", "semanal", "semana_anterior"]

[api]
host = "127.0.0.1"
porta = 8020                       # beta; v1 em uso = 8010 (8000 ocupada pelo VS Code)

[painel]
refresh_s = 1                      # [pref] 2026-10-19
porta_web = 5190                   # beta; v1 em uso = 5180 (5173 ocupada pelo VS Code)
tema = "escuro"
casas_decimais = 2

[atencoes]
simbolo_sem_cotacao_s = 60         # sem tick há X s → atenção
margem_zero_com_posicao = true     # anomalia XP Demo

[mercado]                          # candles p/ estudo (dado de mercado = estudo/fixture, nunca sinal)
timeframe = "M1"
dias_iniciais = 90                 # [pref] 2026-10-20 base de uso = 90 dias de M1; faltando no início → completa p/ trás
dias_iniciais_ticks = 90           # [pref] 2026-10-20 negócios tick a tick (~1,2 GB / 90 d)
bloco_dias = 7                     # [obs] 2026-10-20 SDK recusa intervalo M1 longo (~>60 d) → busca em blocos
pasta = "data/mercado"             # fora do git (volume)
banco_ticks = "data/mercado/ticks.sqlite"  # negócios tick a tick (~1 mi/ativo/90 d)

[spread]                           # atenção, nunca decisivo
spread_max_pct = 0.5               # [pref] 2026-10-20 % do preço; acima → atenção
ticks_acima_media = 4              # [pref] 2026-10-20 spread > média do ativo + N ticks (centavos) → atenção (2 gerava ruído)
janela_sessoes = 20                # [hip] sessões M1 p/ média
min_amostras = 300                 # [hip] candles mínimos p/ usar a média

[log]
nivel = "INFO"
pasta = "logs"
